                ## Export Course Data

                > Once an export job is complete, export a series of `jsonl` files with course details. The `latest` fetches the
                > most recent export if one exists

                **Endpoint:** `http://localhost:8080/api/v2/exports/{jobID}/records`

                **Endpoint:** `http://localhost:8080/api/v2/exports/latest/records`

                **Request Method:** `GET`

                ### Path Variables

                | Variable | Type   | Description |
                |:--------:|--------|-------------|
                |  jobID   | String | Job ID      |

                The `jobID` and polling url can be found in the JobStartResponse or ExportJobStatusResponse.

                ### Responses

                | Response Code | Type                     | Description                                                                              |
                |:-------------:|--------------------------|------------------------------------------------------------------------------------------|
                |      200      | `application/zip`        | `zip` of `jsonl` files.  Default file name is `<export>_<export_date>_<export_time>.zip` |
                |      404      | MissingExportIDException | Requested ID does not exist                                                              |

                There are eight `jsonl` tables of data:

                - `campuses.jsonl`: Campus codes and names
                - `terms.jsonl`: Term codes and names
                - `subjects.jsonl`: Subject codes and names
                - `offerings.jsonl`: Subjects offered at a campus during a term
                - `courses.jsonl`: Course details
                - `sections.jsonl`: Course section details
                - `meetings.jsonl`: Section meeting time and locations
                - `instructors.jsonl`: Instructor details

